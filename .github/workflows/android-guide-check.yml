name: Android guide checks
on:
  push:
    branches: ['codex/finishing-content-2026-10-11']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: guide-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Inspect available preview key cache metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/caches?key=fayroz-preview-debug-key-v1&per_page=100"
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request) as response:
              data = json.load(response)
          print("Preview cache entries:", data["total_count"])
          for entry in data["actions_caches"]:
              print(json.dumps({key: entry.get(key) for key in ("id", "ref", "key", "created_at", "last_accessed_at", "size_in_bytes")}))
          PY
      - name: Reuse preview signing key
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: fayroz-preview-debug-key-v1
      - name: Create temporary CI debug key
        run: |
          if [ ! -f debug.keystore ]; then
            if [ "$GITHUB_REF" = "refs/heads/codex/finishing-content-2026-10-11" ] || [ "$GITHUB_HEAD_REF" = "codex/finishing-content-2026-10-11" ]; then
              echo "Original preview signing key is missing; refusing an incompatible update."
              exit 1
            fi
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Unit tests and debug compilation
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Configure independent mobile preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          build = Path("app/build.gradle.kts")
          content = build.read_text()
          old = 'applicationId = "com.aistudio.fayrozguide.kpzmva"'
          assert content.count(old) == 1
          content = content.replace(old, 'applicationId = "com.aistudio.fayrozguide.kpzmva.preview"')
          content = content.replace('versionName = "1.0"', 'versionName = "1.5-preview"')
          content = content.replace('versionCode = 1', 'versionCode = 5')
          build.write_text(content)
          strings = Path("app/src/main/res/values/strings.xml")
          content, count = re.subn(r'(<string name="app_name">).*?(</string>)', r'\1FAYROZ Guide - Test\2', strings.read_text())
          assert count == 1
          strings.write_text(content)
          PY
      - name: Build and verify mobile APK
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test "$(apkanalyzer manifest application-id "$APK")" = "com.aistudio.fayrozguide.kpzmva.preview"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          test "$(apkanalyzer manifest version-code "$APK")" = "5"
          if [ "$GITHUB_REF" = "refs/heads/codex/finishing-content-2026-10-11" ] || [ "$GITHUB_HEAD_REF" = "codex/finishing-content-2026-10-11" ]; then
            CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
            test "$CERT" = "fc13f6eaa79e0beb6dcfd67dc05fd8b954aa6513316bef6d83a6d6f39bce18f5"
          fi
          mkdir -p delivery
          cp "$APK" delivery/FAYROZ-Finishing-Guide-v1.5-preview.apk
          cp docs/content-review/FINAL_REVIEW.md delivery/
          git archive --format=zip --output=delivery/FAYROZ-Finishing-Guide-v1.5-source.zip HEAD
          cd delivery
          sha256sum FAYROZ-Finishing-Guide-v1.5-preview.apk FAYROZ-Finishing-Guide-v1.5-source.zip > SHA256.txt
      - name: Preserve installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FAYROZ-Finishing-Guide-test-apk
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
